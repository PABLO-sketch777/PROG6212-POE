name: RaceDay CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet build src/RaceDay.Web/RaceDay.Web.csproj --configuration Release
      - run: dotnet test --no-build --configuration Release
      - name: Validate Part 1 documents
        run: test -f docs/erd.mmd && test -f docs/endpoint-plan.md && test -f docs/schema.sql
